name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ① 检查静态页面是否完整
  static-check:
    name: 静态页面检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查必需文件
        run: |
          set -e
          files=(
            "README.md"
            "01-动物验证码/demo/login-demo.html"
            "01-动物验证码/java/CaptchaServlet.java"
            "01-动物验证码/接入说明.md"
            "02-视频站/index.html"
          )
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少文件：$f"
              exit 1
            fi
            echo "✓ $f"
          done

      - name: 检查页面关键字
        run: |
          set -e
          grep -q "动物验证码" "01-动物验证码/demo/login-demo.html" || { echo "::error::演示页里没有验证码关键字"; exit 1; }
          grep -q "ad-layer" "02-视频站/index.html" || { echo "::error::视频站里没有广告层"; exit 1; }
          echo "✓ 关键字检查通过"

  # ② 编译 CaptchaServlet（验证 Java 代码能过编译）
  java-compile:
    name: 编译 CaptchaServlet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 下载 Servlet API
        run: |
          mkdir -p lib out
          curl -fsSL -o lib/javax.servlet-api-4.0.1.jar \
            https://repo1.maven.org/maven2/javax/servlet/javax.servlet-api/4.0.1/javax.servlet-api-4.0.1.jar
          ls -lh lib/

      - name: javac 编译
        run: |
          javac -encoding UTF-8 -cp lib/javax.servlet-api-4.0.1.jar \
            -d out "01-动物验证码/java/CaptchaServlet.java"
          echo "编译产物："
          find out -name '*.class'

      - name: 上传 class 产物
        uses: actions/upload-artifact@v4
        with:
          name: CaptchaServlet-classes
          path: out/**/*.class
          if-no-files-found: error
